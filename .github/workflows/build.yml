name: Build APK

# Любой push — собрать APK (артефакт BudsEQ-apk).
# Тег vX.Y (например, v5.0) — ещё и выложить релиз: телефоны получат автообновление.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи из секретов (тот же, что в Termux) — иначе обновление не встанет поверх
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eq.keystore"
            echo "EQ_KEYSTORE=$RUNNER_TEMP/eq.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета KEYSTORE_BASE64 — APK подписан временным ключом, релиз не публикуется"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          EQ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EQ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EQ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: |
          VER=$(sed -n "s/.*versionName *'\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "EQ-$VER.apk"
          # постоянное имя для ссылки releases/latest/download/EQ.apk
          cp "EQ-$VER.apk" EQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudsEQ-apk
          path: EQ-*.apk

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v v="### $VER" '$0==v{f=1;next} f&&/^##/{exit} f' README.md > notes.md
          [ -s notes.md ] || echo "EQ $VER" > notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: EQ ${{ env.VER }}
          body_path: notes.md
          files: |
            EQ-${{ env.VER }}.apk
            EQ.apk
