name: Build APK

# Любой push — собрать APK (артефакт BudsEQ-apk).
# Есть секреты с ключом подписи (тем же, что в Termux, см. ci-key.sh) и новая версия в app/build.gradle,
# для которой ещё нет релиза vX.Y, — выложить релиз сразу: телефоны получат автообновление без Termux.
# Тег vX.Y — тоже выложить релиз (как раньше).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи из секретов (тот же, что в Termux) — иначе обновление не встанет поверх
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eq.keystore"
            echo "EQ_KEYSTORE=$RUNNER_TEMP/eq.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета KEYSTORE_BASE64 — APK подписан временным ключом, релиз не публикуется"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          EQ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EQ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EQ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: |
          VER=$(sed -n "s/.*versionName *'\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "EQ-$VER.apk"
          # постоянное имя для ссылки releases/latest/download/EQ.apk
          cp "EQ-$VER.apk" EQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudsEQ-apk
          path: EQ-*.apk

      # новая версия? (релиза vX.Y ещё нет) — тогда выкладываем сами, без тега и без Termux
      - name: New version
        if: env.SIGNED == 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VER")
          echo "release v$VER: HTTP $CODE"
          if [ "$CODE" = "404" ]; then echo "NEW=true" >> "$GITHUB_ENV"; fi

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || env.NEW == 'true'
        run: |
          awk -v v="### $VER" '$0==v{f=1;next} f&&/^##/{exit} f' README.md > notes.md
          [ -s notes.md ] || echo "EQ $VER" > notes.md

      - name: Publish release
        if: (startsWith(github.ref, 'refs/tags/v') || env.NEW == 'true') && env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: EQ ${{ env.VER }}
          body_path: notes.md
          files: |
            EQ-${{ env.VER }}.apk
            EQ.apk
