name: Build iOS

# Изменилось что-то в ios/ — собрать EQ для iPhone (IPA без подписи: Sideloadly или AltStore
# подпишут его вашим Apple ID) и снять скриншоты на симуляторах разных iPhone (ветка ios-shots).
# Тег ios-vX.Y — ещё и выложить IPA в релиз. Релиз помечен как пре-релиз и не «последний»,
# поэтому ссылка releases/latest/download/EQ.apk и автообновление Android не меняются.
on:
  push:
    branches-ignore: [ios-shots]
    tags: ['ios-v*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          # самый новый стабильный Xcode на машине — в нём симуляторы самых новых iPhone
          X=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen >/dev/null

      - name: Build
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project EQ.xcodeproj -scheme EQ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
          APP=build/Build/Products/Release-iphoneos/EQ.app
          plutil -p "$APP/Info.plist"
          VER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "../EQ-iOS-$VER.ipa" Payload
          cp "../EQ-iOS-$VER.ipa" ../EQ-iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: EQ-iOS-ipa
          path: EQ-iOS-*.ipa

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          awk -v v="### iOS $VER" '$0==v{f=1;next} f&&/^##/{exit} f' README.md > notes.md
          [ -s notes.md ] || echo "EQ для iPhone $VER" > notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          name: EQ для iPhone ${{ env.VER }}
          body_path: notes.md
          prerelease: true
          make_latest: false
          files: |
            EQ-iOS-${{ env.VER }}.ipa
            EQ-iOS.ipa

  screenshots:
    runs-on: macos-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen >/dev/null

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project EQ.xcodeproj -scheme EQ -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Screenshots
        working-directory: ios
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/EQ.app
          RT=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rs[-1]["identifier"])')
          echo "Runtime: $RT"
          xcrun simctl list devicetypes | grep -i iphone || true
          mkdir -p ../shots
          # самый старый поддерживаемый, маленькие и самые новые — чтобы проверить все виды экранов
          for NAME in "iPhone 11 Pro Max" "iPhone SE (3rd generation)" "iPhone 13 mini" "iPhone 16e" \
                      "iPhone 17 Pro Max" "iPhone 17 Pro" "iPhone Air" "iPhone 16 Pro Max"; do
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          for t in json.load(sys.stdin)['devicetypes']:
              if t['name'] == sys.argv[1]:
                  print(t['identifier'])" "$NAME")
            if [ -z "$TYPE" ]; then echo "нет симулятора $NAME"; continue; fi
            UDID=$(xcrun simctl create "shot" "$TYPE" "$RT" 2>/dev/null) || { echo "не создан $NAME"; continue; }
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b >/dev/null
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
              --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" "$APP"
            SAFE=$(echo "$NAME" | tr -cd 'A-Za-z0-9')
            for SHOT in "0" "1" "2" "3" "0 -car"; do
              set -- $SHOT
              TAB=$1
              EXTRA=${2:-}
              xcrun simctl terminate "$UDID" lv.budseq.eq 2>/dev/null || true
              xcrun simctl launch "$UDID" lv.budseq.eq -demo -tab "$TAB" $EXTRA \
                -AppleLanguages "(ru)" -AppleLocale ru_RU >/dev/null
              sleep 6
              OUT="../shots/${SAFE}-tab${TAB}${EXTRA:+-car}.png"
              xcrun simctl io "$UDID" screenshot "$OUT" >/dev/null
              sips -s format jpeg -s formatOptions 72 --resampleHeight 1400 "$OUT" --out "${OUT%.png}.jpg" >/dev/null
              rm "$OUT"
            done
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          done
          ls -la ../shots

      - uses: actions/upload-artifact@v4
        with:
          name: EQ-iOS-screenshots
          path: shots

      - name: Push screenshots to ios-shots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_SHA" > shots/COMMIT
          git checkout --orphan ios-shots-new
          git rm -rq --cached .
          git add -f shots
          git commit -qm "Скриншоты EQ для iPhone: ${GITHUB_SHA::7}"
          git push -f origin HEAD:ios-shots
